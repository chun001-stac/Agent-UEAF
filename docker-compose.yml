services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ueaf
      POSTGRES_USER: ueaf
      POSTGRES_PASSWORD: ueaf
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ueaf -d ueaf"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ueaf
      MINIO_ROOT_PASSWORD: ueaf-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
