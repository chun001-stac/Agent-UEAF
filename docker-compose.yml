services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ueaf
      POSTGRES_USER: ueaf
      POSTGRES_PASSWORD: ${UEAF_POSTGRES_PASSWORD:-ueaf}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ueaf -d ueaf"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${UEAF_MINIO_ROOT_USER:-ueaf}
      MINIO_ROOT_PASSWORD: ${UEAF_MINIO_ROOT_PASSWORD:-ueaf-local-dev-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  nats-data:
  minio-data:
  qdrant-data:
