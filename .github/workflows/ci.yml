name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ueaf
          POSTGRES_USER: ueaf
          POSTGRES_PASSWORD: ueaf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ueaf -d ueaf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked toolchain
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.32"
          uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run --no-sync ruff check src tests migrations
      - name: Ruff format
        run: uv run --no-sync ruff format --check src tests migrations
      - name: Mypy
        run: uv run --no-sync mypy src tests migrations
      - name: Schema catalog, references, event registry, and lock history
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          baseline_lock="$RUNNER_TEMP/schema-lock.baseline.json"
          if [[ -n "$base_sha" ]] && git cat-file -e "${base_sha}:schemas/schema-lock.json" 2>/dev/null; then
            git show "${base_sha}:schemas/schema-lock.json" > "$baseline_lock"
            uv run --no-sync python -m ueaf.common.schema_registry \
              schemas --baseline-lock "$baseline_lock"
          else
            uv run --no-sync python -m ueaf.common.schema_registry schemas
          fi
      - name: Alembic smoke
        env:
          UEAF_DATABASE_URL: postgresql+asyncpg://ueaf:ueaf@127.0.0.1:5432/ueaf
        run: |
          uv run --no-sync alembic history
          uv run --no-sync alembic upgrade head --sql
          uv run --no-sync alembic upgrade head
      - name: Pytest
        run: uv run --no-sync pytest --junitxml=pytest-results.xml
      - name: Upload pytest traceability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn

  local-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Start and verify the local dependency profile
        run: docker compose up -d --wait --wait-timeout 120
      - name: Diagnose local profile failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Tear down the local dependency profile
        if: always()
        run: docker compose down -v --remove-orphans
