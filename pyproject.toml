[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ueaf"
version = "0.1.0"
description = "UEAF V1 reference implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "nats-py>=2.11,<3",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "boto3>=1.40,<2",
  "jsonschema[format]>=4.25,<5",
  "referencing>=0.36,<1",
  # qdrant-client pinned to 1.13.x to match the docker-compose/CI qdrant server
  # (v1.13.6). Newer clients (>=1.14) drop the ``search`` method in favour of
  # ``query_points``, whose endpoint the v1.13 server does not support.
  "qdrant-client>=1.13,<1.14",
  # Local embeddings (BAAI/bge-small-zh-v1.5) are a RAG core capability: the
  # model runs fully local with no external API key, so sentence-transformers is
  # a runtime dependency (not just dev). It is heavy (pulls torch); keep it in
  # main because RAG retrieval depends on it in production.
  "sentence-transformers>=3,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ueaf"]

[tool.uv]
required-version = "==0.11.32"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "test_id(*ids): map a test family to one or more registered UEAF acceptance Test IDs",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ueaf"]
